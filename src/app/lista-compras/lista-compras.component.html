<div class="container">
    <h1>Lista de Compras</h1>

    <form #frm="ngForm" class="add-item-form" (ngSubmit)="addItem()">
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Digite o nome do item" 
            [(ngModel)]="nome" />
        <button type="submit">Adicionar</button>
        <button type="button" (click)="limparLista()">Limpar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (item of items; track item.id) {
                <tr>
                    <td>{{item.id}}</td>
                    <td><span [ngClass]="{ 'item-riscado': item.comprado }">{{item.nome}}</span></td>
                    <td>
                        <input type="checkbox" (click)="riscarItem(item)" [checked]="item.comprado" />
                    </td>
                </tr>
            } @empty {
                <tr>
                    <td colspan="3">Nenhum item adicionado</td>
                </tr>
            }
        </tbody>
    </table>

    {{ items }}
</div>
