<div class="container">
    <h1>Lista de Compras</h1>

    <form #frm="ngForm" class="add-item-form" (ngSubmit)="addItem()">
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Digite o nome do item" 
            [(ngModel)]="nome" />
        <button type="submit">Adicionar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (item of items; track item.id) {
                <tr>
                    <td>{{item.id}}</td>
                    <td>{{item.nome}}</td>
                    <td>
                        <input type="checkbox" />
                    </td>
                </tr>
            }
        </tbody>
    </table>

    {{ items }}
</div>
