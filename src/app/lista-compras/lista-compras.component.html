<div class="container">
    <h1>Lista de Compras</h1>

    <form #frm="ngForm" class="add-item-form" (ngSubmit)="addItem()">
        <input 
            type="text" 
            id="nome" 
            name="nome" 
            placeholder="Digite o nome do item" 
            [(ngModel)]="nome" />
        <button type="submit">Adicionar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Arroz</td>
                <td>
                    <input type="checkbox" />
                </td>
            </tr>
            <tr>
                <td>2</td>
                <td>Maça</td>
                <td>
                    <input type="checkbox" />
                </td>
            </tr>
        </tbody>
    </table>

    {{ items }}
</div>
